name: ci

on:
  push:
    branches: ["server"]
  pull_request:
    branches: ["server"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      OPAMSOLVERTIMEOUT: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev libev-dev libgmp-dev pkg-config m4

      - name: Install opam dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build @all

      - name: Test
        run: opam exec -- dune runtest

  build-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner_lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          image_name="ghcr.io/$owner_lc/comp-theory-toolkit"
          image_tag="sha-$SHA"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s:%s\n' "$image_name" "$image_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.image_name }}:server
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_PRIVATE_KEY }}

      - name: Add server to known_hosts
        env:
          SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_ADDRESS" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SECRET_CODE: ${{ secrets.SECRET_CODE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ github.ref_name }}
          APP_IMAGE: ${{ needs.build-image.outputs.image_ref }}
        run: |
          ssh "${SERVER_USERNAME}@${SERVER_ADDRESS}" \
            "SERVER_APP_DIR='${SERVER_APP_DIR}' SECRET_CODE='${SECRET_CODE}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' REPO_NAME='${REPO_NAME}' BRANCH_NAME='${BRANCH_NAME}' APP_IMAGE='${APP_IMAGE}' bash -se" <<'EOF'
          set -eu

          app_dir=""
          for candidate in \
            "${SERVER_APP_DIR:-}" \
            "$HOME/$REPO_NAME" \
            "/srv/$REPO_NAME" \
            "/opt/$REPO_NAME"
          do
            if [ -n "$candidate" ] && [ -d "$candidate/.git" ]; then
              app_dir="$candidate"
              break
            fi
          done

          if [ -z "$app_dir" ]; then
            printf '%s\n' \
              "Could not locate repo directory for $REPO_NAME." \
              "Set GitHub variable SERVER_APP_DIR or use one of: $HOME/$REPO_NAME, /srv/$REPO_NAME, /opt/$REPO_NAME." >&2
            exit 1
          fi

          cd "$app_dir"
          git fetch origin "$BRANCH_NAME"

          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            git checkout "$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME" "origin/$BRANCH_NAME"
          fi

          git pull --ff-only origin "$BRANCH_NAME"

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          fi

          ACCESS_GATE_CODE="$SECRET_CODE" APP_IMAGE="$APP_IMAGE" APP_MODE=deployment \
            ./bin/compose pull app web
          ACCESS_GATE_CODE="$SECRET_CODE" APP_IMAGE="$APP_IMAGE" APP_MODE=deployment \
            ./bin/compose up -d --no-build app web nginx
          EOF

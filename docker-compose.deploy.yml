services:
  db:
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    command: ["--webroot", "${MAILPIT_WEBROOT:-/mailpit}"]
    restart: unless-stopped

  app:
    pull_policy: always
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}

  web:
    pull_policy: always
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started

  trafficd:
    pull_policy: always
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started

  nginx:
    image: ${NGINX_IMAGE:-comp-theory-toolkit-nginx:dev}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - "${WEB_PUBLIC_PORT:-80}:80"
      - "${WEB_TLS_PUBLIC_PORT:-443}:443"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-recognita.xyz}
      NGINX_ENABLE_TLS: ${NGINX_ENABLE_TLS:-auto}
      NGINX_TLS_CERT_FILE: ${NGINX_TLS_CERT_FILE:-/etc/nginx/certs/origin.crt}
      NGINX_TLS_KEY_FILE: ${NGINX_TLS_KEY_FILE:-/etc/nginx/certs/origin.key}
    volumes:
      - ${NGINX_CERTS_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx

  fail2ban:
    image: ${FAIL2BAN_IMAGE:-comp-theory-toolkit-fail2ban:dev}
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      nginx:
        condition: service_started
    environment:
      TZ: ${TZ:-Europe/Rome}
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 7d
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - fail2ban_data:/data/db

volumes:
  nginx_logs:
  fail2ban_data:
